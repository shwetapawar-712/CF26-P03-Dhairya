version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nlc_backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///./data/nlc.db
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000", "http://localhost:80"]
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlc_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
